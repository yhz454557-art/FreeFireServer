name: build-deploy

# Build a per-module image, push to GHCR, then have the VPS pull + restart.
# Secrets required (repo settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY   — SSH into the OCI VPS
# GITHUB_TOKEN (auto) pushes to ghcr.io/foices/*.
on:
  push:
    branches: [main, feat/infra-migration]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: foices

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Garante permissão para enviar as imagens
    strategy:
      matrix:
        include:
          - image: ff-node
            dockerfile: docker/node.Dockerfile
          - image: ff-match
            dockerfile: docker/match.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }} # Corrigido para bater com a organização/dono do pacote
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Pull + gated migrate + drained restart on the VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          MATCH_DRAIN_SECONDS: ${{ vars.MATCH_DRAIN_SECONDS || '90' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: MATCH_DRAIN_SECONDS
          script: |
            set -eo pipefail
            cd /opt/freefire
            docker compose pull

            # --- MIGRATION GATE ---------------------------------------------------
            docker compose up -d postgres redis
            DB_URL=$(grep -E '^DATABASE_URL=' .env 2>/dev/null | head -n1 | cut -d= -f2- || true)
            if [ -n "$DB_URL" ]; then
              echo "[deploy] running gated DB migrations…"
              docker compose run --rm --no-deps matchmaker npm run migrate
            else
              echo "[deploy] DATABASE_URL unset — SQLite mode, skipping migrations"
            fi

            # --- ROLL STATELESS TIERS --------------------------------------------
            docker compose up -d --remove-orphans \
              traefik live login main gateway settlement auth-connect auth-login

            # --- MATCH DRAIN ------------------------------------------------------
            echo "[deploy] draining matches (${MATCH_DRAIN_SECONDS}s)…"
            docker compose stop matchmaker
            sleep "${MATCH_DRAIN_SECONDS}"
            docker compose up -d match matchmaker

            docker image prune -f
